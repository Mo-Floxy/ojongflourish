<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="ai course cover">

  <defs>
    <linearGradient id="bg-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171334"/>
      <stop offset="1" stop-color="#2B1C64"/>
    </linearGradient>
    <linearGradient id="line-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35B8E8"/>
      <stop offset="1" stop-color="#7047EB"/>
    </linearGradient>
    <radialGradient id="glow-ai">
      <stop offset="0" stop-color="#35B8E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35B8E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-ai" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
  </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#bg-ai)"/>
  <rect width="900" height="560" fill="url(#grid)"/>
  <circle cx="760" cy="90" r="230" fill="url(#glow-ai)" filter="url(#soft-ai)"/>
  <circle cx="110" cy="500" r="180" fill="url(#glow-ai)" filter="url(#soft-ai)" opacity="0.6"/>
  <g>
    <g stroke="url(#line-ai)" stroke-width="3" stroke-opacity="0.75">
      <path d="M270 200 500 300 730 180M270 200 500 300 730 420M270 410 500 300 730 180M270 410 500 300 730 420M270 200 270 410M730 180 730 420"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.85">
      <circle cx="270" cy="200" r="12"/><circle cx="270" cy="410" r="12"/>
      <circle cx="730" cy="180" r="12"/><circle cx="730" cy="420" r="12"/>
    </g>
    <circle cx="500" cy="300" r="78" fill="url(#glow-ai)" filter="url(#soft-ai)"/>
    <circle cx="500" cy="300" r="52" fill="#171334" fill-opacity="0.65" stroke="url(#line-ai)" stroke-width="6"/>
    <circle cx="500" cy="300" r="22" fill="#FFB86B"/></g>
</svg>
