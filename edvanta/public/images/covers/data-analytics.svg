<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="data-analytics course cover">

  <defs>
    <linearGradient id="bg-data-analytics" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171334"/>
      <stop offset="1" stop-color="#192F5C"/>
    </linearGradient>
    <linearGradient id="line-data-analytics" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35B8E8"/>
      <stop offset="1" stop-color="#7047EB"/>
    </linearGradient>
    <radialGradient id="glow-data-analytics">
      <stop offset="0" stop-color="#35B8E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35B8E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-data-analytics" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
  </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#bg-data-analytics)"/>
  <rect width="900" height="560" fill="url(#grid)"/>
  <circle cx="760" cy="90" r="230" fill="url(#glow-data-analytics)" filter="url(#soft-data-analytics)"/>
  <circle cx="110" cy="500" r="180" fill="url(#glow-data-analytics)" filter="url(#soft-data-analytics)" opacity="0.6"/>
  <g></g>
</svg>
